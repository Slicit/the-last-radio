name: CI

# Tests every push and pull request. Once they pass, images go to GitHub's
# registry (pull requests are only tested):
#   main       → ghcr.io/<owner>/the-last-radio-{server,web}:main and :sha-<commit>
#   tag v1.2.3 → :1.2.3, :1.2 and :latest (git tag v1.2.3 && git push --tags)
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Migrations run on real databases once released: never edit one, add a new one.
      - name: Migrations are append-only
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}"...HEAD -- apps/server/drizzle/ | grep -E '^(M|D|R)' | grep '\.sql' || true)
          if [ -n "$changed" ]; then
            echo "::error::Released migrations must not change. Add a new migration instead:"
            echo "$changed"
            exit 1
          fi

      # Unit, integration and end-to-end tests in a throwaway copy of the stack.
      # Tests that need YouTube/SoundCloud (@network) are skipped: CI's IPs get bot-checked.
      - name: Test
        env:
          E2E_ARGS: --grep-invert @network
        run: scripts/test.sh

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  publish:
    name: Publish ${{ matrix.image }} image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            dockerfile: apps/server/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names are lowercased by metadata-action (registries require it).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/the-last-radio-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
