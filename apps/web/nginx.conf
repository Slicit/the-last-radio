server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 64k;
  error_page 413 /__too_large;
  location = /__too_large {
    internal;
    default_type application/json;
    return 413 '{"error":"That request is too large"}';
  }

  # No framing (the OAuth consent page must never be clickjacked), no sniffing,
  # and scripts only from us. Thumbnails come from the music sites (https).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # Behind a host port mapping; keep redirects relative so the port survives.
  absolute_redirect off;
  root /usr/share/nginx/html;

  # Pushing a track runs yt-dlp synchronously, which can take a while.
  # $http_host keeps the port, so OAuth/MCP metadata advertises the right URLs.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 90s;
  }

  # Profile photo uploads: the only place a big body is allowed (the API caps it at 5 MB).
  location = /api/me/avatar {
    client_max_body_size 6m;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # MCP server for AI assistants, and the OAuth discovery documents it relies on.
  location = /mcp {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location /.well-known/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The API decides who may hear a station (private stations): checked before every stream file.
  location = /__hls_auth {
    internal;
    proxy_pass http://api:3000/api/internal/hls-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Never reachable from outside.
  location /api/internal/ {
    return 404;
  }

  # HLS from mediamtx: /hls/<slug>/index.m3u8 -> mediamtx:8888/<slug>/index.m3u8
  location /hls/ {
    auth_request /__hls_auth;
    proxy_pass http://mediamtx:8888/;
    # mediamtx redirects to absolute paths (cookie check); keep them under /hls.
    proxy_redirect / /hls/;
    proxy_buffering off;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
