server {
  listen 80;
  server_name _;
  # Behind a host port mapping; keep redirects relative so the port survives.
  absolute_redirect off;
  root /usr/share/nginx/html;

  # Pushing a track runs yt-dlp synchronously, which can take a while.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
  }

  # HLS from mediamtx: /hls/<slug>/index.m3u8 -> mediamtx:8888/<slug>/index.m3u8
  location /hls/ {
    proxy_pass http://mediamtx:8888/;
    # mediamtx redirects to absolute paths (cookie check); keep them under /hls.
    proxy_redirect / /hls/;
    proxy_buffering off;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
