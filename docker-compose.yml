name: lastradio

# Everything lives on a private network; only the web UI (and postgres, for
# debugging) is published on the host. Container names, volumes and the
# network are all prefixed so this stack never collides with neighbours.

services:
  postgres:
    image: postgres:16-alpine
    container_name: lastradio-postgres
    environment:
      POSTGRES_DB: lastradio
      POSTGRES_USER: lastradio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-28732}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastradio -d lastradio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [net]

  mediamtx:
    image: bluenviron/mediamtx:1.19.1
    container_name: lastradio-mediamtx
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    networks: [net]

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: lastradio-server
    container_name: lastradio-api
    command: ["node", "dist/api.js"]
    environment: &server-env
      DATABASE_URL: postgres://lastradio:${POSTGRES_PASSWORD:-change-me}@postgres:5432/lastradio
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_RTSP: rtsp://mediamtx:8554
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CACHE_DIR: /data/cache
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [net]

  broadcaster:
    image: lastradio-server
    container_name: lastradio-broadcaster
    command: ["node", "dist/broadcaster.js"]
    # On restart the broadcaster lets songs on air finish before exiting.
    stop_grace_period: 25m
    environment: *server-env
    volumes:
      - audiocache:/data/cache
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }
      mediamtx: { condition: service_started }
    restart: unless-stopped
    networks: [net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: lastradio-web
    container_name: lastradio-web
    ports:
      - "${WEB_PORT:-28700}:80"
    depends_on: [api, mediamtx]
    restart: unless-stopped
    networks: [net]

volumes:
  pgdata:
    name: lastradio-pgdata
  audiocache:
    name: lastradio-audiocache

networks:
  net:
    name: lastradio-net
