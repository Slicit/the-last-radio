name: lastradio

# Logs contain IP addresses (nginx access logs): keep at most ~30 MB per
# service, rotated, as stated in the privacy notice.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Everything lives on a private network; only the web UI (and postgres, for
# debugging) is published on the host. Container names, volumes and the
# network are all prefixed with $STACK (default "lastradio") so this stack
# never collides with neighbours, and a test copy can run beside it:
#   STACK=lastradio-test WEB_PORT=28800 PG_PORT=28832 docker compose -p lastradio-test up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${STACK:-lastradio}-postgres
    logging: *logging
    environment:
      POSTGRES_DB: lastradio
      POSTGRES_USER: lastradio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-28732}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastradio -d lastradio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [net]

  mediamtx:
    image: bluenviron/mediamtx:1.19.1
    container_name: ${STACK:-lastradio}-mediamtx
    logging: *logging
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    networks: [net]

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    # Built locally by default; set SERVER_IMAGE to use a released image
    # (e.g. ghcr.io/slicit/the-last-radio-server:1.2.3) with scripts/deploy.sh --pull.
    image: ${SERVER_IMAGE:-lastradio-server}
    container_name: ${STACK:-lastradio}-api
    logging: *logging
    command: ["node", "dist/api.js"]
    environment: &server-env
      DATABASE_URL: postgres://lastradio:${POSTGRES_PASSWORD:-change-me}@postgres:5432/lastradio
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_RTSP: rtsp://mediamtx:8554
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PRIVACY_CONTROLLER: ${PRIVACY_CONTROLLER:-}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
      REGISTRATIONS_PER_HOUR: ${REGISTRATIONS_PER_HOUR:-5}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_RETURN_PATH: ${MAIL_RETURN_PATH:-}
      YOUTUBE_PROXY: ${YOUTUBE_PROXY:-}
      CACHE_DIR: /data/cache
      CACHE_SIZE_GB: ${CACHE_SIZE_GB:-2}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [net]

  broadcaster:
    image: ${SERVER_IMAGE:-lastradio-server}
    container_name: ${STACK:-lastradio}-broadcaster
    logging: *logging
    command: ["node", "dist/broadcaster.js"]
    # On restart the broadcaster lets songs on air finish before exiting.
    stop_grace_period: 25m
    environment: *server-env
    volumes:
      - audiocache:/data/cache
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }
      mediamtx: { condition: service_started }
    restart: unless-stopped
    networks: [net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${WEB_IMAGE:-lastradio-web}
    container_name: ${STACK:-lastradio}-web
    logging: *logging
    ports:
      - "${WEB_PORT:-28700}:80"
    depends_on: [api, mediamtx]
    restart: unless-stopped
    networks: [net]

volumes:
  pgdata:
    name: ${STACK:-lastradio}-pgdata
  audiocache:
    name: ${STACK:-lastradio}-audiocache

networks:
  net:
    name: ${STACK:-lastradio}-net
