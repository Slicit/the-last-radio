# Listen and Allow are set from the tunnel addresses at start (entrypoint.sh).
User tinyproxy
Group tinyproxy
Port 8888
Listen 10.66.0.2
Allow 10.66.0.1
Timeout 600
MaxClients 20
# HTTPS only (CONNECT to 443), and only the hosts in "filter".
ConnectPort 443
FilterType ere
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
DisableViaHeader Yes
LogLevel Notice
